<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupportSense AI - Project Cover</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      background-color: #070A0F;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 bg-[#070A0F] antialiased select-none">
  <!-- 16:9 Aspect Ratio Artboard Container -->
  <div class="relative w-full max-w-6xl aspect-[16/9] bg-[#0A0D14] rounded-3xl border border-white/10 p-8 md:p-12 flex flex-col justify-between overflow-hidden shadow-2xl">
    
    <!-- 1. PROJECT TITLE (Only Element 1) -->
    <div class="text-center z-10 pt-2">
      <h1 class="text-3xl md:text-5xl lg:text-6xl font-extrabold tracking-tight text-white drop-shadow-sm">
        SupportSense AI
      </h1>
    </div>

    <!-- MAIN DISPLAY AREA: SHOWCASE SCREEN & ARCHITECTURE DIAGRAM -->
    <div class="relative flex-1 flex items-center justify-center mt-6 mb-2">
      
      <!-- 2. SHOWCASE SCREEN IN SLEEK BROWSER MOCKUP (Only Element 2) -->
      <div class="w-full max-w-4xl bg-[#141820] rounded-2xl border border-white/15 overflow-hidden shadow-[0_25px_60px_-15px_rgba(0,0,0,0.8)] transform transition-transform">
        <!-- Mac Window Header -->
        <div class="bg-[#10141C] border-b border-white/10 px-4 py-2.5 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-[#FF5F56]/90 inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-[#FFBD2E]/90 inline-block"></span>
          <span class="w-3 h-3 rounded-full bg-[#27C93F]/90 inline-block"></span>
          <div class="mx-auto bg-black/30 border border-white/5 rounded-md px-6 py-0.5 text-[11px] font-mono text-slate-400">
            supportsense.internal/console
          </div>
        </div>
        <!-- Screen Content Image -->
        <img 
          src="assets/showcase_screen.png" 
          alt="SupportSense AI Showcase Screen" 
          class="w-full h-auto object-cover block"
        />
      </div>

      <!-- 3. ARCHITECTURE DIAGRAM FLOATING CARD (Only Element 3) -->
      <div class="absolute -bottom-4 -right-2 md:bottom-2 md:right-4 w-72 md:w-96 bg-white rounded-xl border border-slate-200 p-2 shadow-[0_20px_50px_rgba(0,0,0,0.6)] z-20">
        <img 
          src="assets/system_architecture.jpg" 
          alt="SupportSense AI Architecture Diagram" 
          class="w-full h-auto object-contain rounded-lg block"
        />
      </div>

    </div>

  </div>
</body>
</html>
