services:
  ollama:
    image: ollama/ollama:latest
    container_name: supportsense_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: supportsense_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: supportsense_postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=supportsense
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/schema_relational.sql:/docker-entrypoint-initdb.d/01-init.sql
    restart: unless-stopped

volumes:
  ollama_data:
  n8n_data:
  postgres_data:
